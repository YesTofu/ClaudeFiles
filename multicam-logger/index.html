<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MULTICAM LOGGER</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap');

:root {
  --bg: #0a0a0a;
  --surface: #111111;
  --border: #1e1e1e;
  --accent: #e8ff47;
  --accent-dim: rgba(232,255,71,0.12);
  --text: #f0f0f0;
  --muted: #555;
  --cam1: #ff6b6b;
  --cam2: #4ecdc4;
  --cam3: #a78bfa;
  --cam4: #fbbf24;
  --cam5: #f97316;
  --cam6: #22d3ee;
  --cam7: #ec4899;
  --cam8: #84cc16;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* HEADER */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 28px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 4px;
  color: var(--accent);
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 20px;
}

.clock {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 1px;
}

/* STATUS BAR */
.status-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 28px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--muted);
  transition: background 0.2s;
}
.status-dot.live { background: #ef4444; animation: pulse 1.2s ease-in-out infinite; }
.status-dot.ready { background: var(--accent); }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.status-text {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
}
.status-text.live { color: #ef4444; }
.status-text.ready { color: var(--accent); }

.elapsed {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 1px;
}
.elapsed.live { color: #ef4444; }
.elapsed.ready { color: var(--accent); }

.cut-count {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 1px;
}

/* MAIN LAYOUT */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* CAM PANEL */
.cam-panel {
  width: 260px;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 16px 12px 12px;
  gap: 8px;
  flex-shrink: 0;
  overflow: hidden;
}

#camList {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 0;
  padding-right: 2px;
}
#camList::-webkit-scrollbar { width: 3px; }
#camList::-webkit-scrollbar-track { background: transparent; }
#camList::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.panel-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 4px;
  padding: 0 4px;
}

.cam-btn {
  position: relative;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 11px 14px;
  background: var(--surface);
  cursor: pointer;
  transition: all 0.12s ease;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  user-select: none;
}

.cam-btn::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--cam-color);
  opacity: 0.5;
  transition: opacity 0.12s;
}

.cam-btn:hover { border-color: #333; background: #161616; }

.cam-btn.active {
  border-color: var(--cam-color);
  background: rgba(255,255,255,0.04);
}
.cam-btn.active::before { opacity: 1; }

.cam-btn.fired {
  animation: camFire 0.3s ease;
}
@keyframes camFire {
  0% { transform: scale(1); }
  40% { transform: scale(0.97); }
  100% { transform: scale(1); }
}

.key-badge {
  width: 28px;
  height: 28px;
  border-radius: 5px;
  background: var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  flex-shrink: 0;
  border: 1px solid #2a2a2a;
  transition: all 0.12s;
}
.cam-btn.active .key-badge {
  background: var(--cam-color);
  color: #000;
  border-color: var(--cam-color);
}

.cam-info { flex: 1; }
.cam-name-input {
  background: transparent;
  border: none;
  outline: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  width: 100%;
  cursor: text;
}
.cam-name-input::placeholder { color: var(--muted); }

.cam-cut-count {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  margin-top: 2px;
}

.cam-indicator {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--cam-color);
  opacity: 0.3;
  flex-shrink: 0;
  transition: opacity 0.12s;
}
.cam-btn.active .cam-indicator { opacity: 1; }

/* CAM DELETE BUTTON */
.cam-remove {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%) translateX(6px);
  opacity: 0;
  transition: opacity 0.15s ease, transform 0.15s ease;
  background: rgba(239,68,68,0.12);
  border: 1px solid rgba(239,68,68,0.25);
  color: #ef4444;
  width: 20px;
  height: 20px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
  z-index: 2;
  flex-shrink: 0;
  padding: 0;
}
.cam-btn:hover .cam-remove {
  opacity: 1;
  transform: translateY(-50%) translateX(0);
}
.cam-remove:hover { background: rgba(239,68,68,0.25) !important; }

/* ADD CAMERA BUTTON */
.add-cam-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  padding: 7px;
  border: 1px dashed #2a2a2a;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s;
  flex-shrink: 0;
}
.add-cam-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-dim);
}

/* MARKER BUTTON */
.marker-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  padding: 8px 12px;
  border: 1px solid #2a2a2a;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s;
  flex-shrink: 0;
}
.marker-btn:hover:not(:disabled) {
  border-color: #fbbf24;
  color: #fbbf24;
  background: rgba(251,191,36,0.08);
}
.marker-btn:disabled { opacity: 0.25; cursor: not-allowed; }
.marker-btn kbd {
  background: var(--border);
  border: 1px solid #2a2a2a;
  border-radius: 3px;
  padding: 1px 5px;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--muted);
  margin-left: auto;
}
.marker-btn:hover:not(:disabled) kbd { color: #fbbf24; border-color: #fbbf24; }

/* MARKER LOG ENTRY */
.log-entry.marker {
  background: rgba(251,191,36,0.04);
  border-bottom-color: rgba(251,191,36,0.08);
}
.log-entry.marker .entry-tc { color: #fbbf24; }
.marker-diamond {
  font-size: 9px;
  color: #fbbf24;
  width: 80px;
  flex-shrink: 0;
  font-family: 'DM Mono', monospace;
  font-weight: 500;
}

/* CONTROLS */
.controls {
  display: flex;
  gap: 8px;
  margin-top: auto;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

.btn {
  flex: 1;
  padding: 10px 8px;
  border-radius: 5px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s;
}
.btn:hover { border-color: #333; background: #161616; }
.btn.primary {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
  font-weight: 500;
}
.btn.primary:hover { background: #d4eb3a; }
.btn.danger { color: #ef4444; border-color: #ef4444; }
.btn.danger:hover { background: rgba(239,68,68,0.1); }
.btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* LOG PANEL */
.log-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.log-header {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.log-title {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
}

.log-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 12px 0;
}

.log-scroll::-webkit-scrollbar { width: 4px; }
.log-scroll::-webkit-scrollbar-track { background: transparent; }
.log-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.log-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 8px;
  color: var(--muted);
}

.log-empty-icon {
  font-size: 32px;
  opacity: 0.3;
}

.log-empty-text {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.log-entry {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 0 24px;
  height: 40px;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  transition: background 0.1s;
  animation: entryIn 0.2s ease;
}

@keyframes entryIn {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: translateX(0); }
}

.log-entry:hover { background: rgba(255,255,255,0.02); }

.log-entry.latest {
  background: rgba(232,255,71,0.04);
}

.entry-num {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  width: 36px;
  flex-shrink: 0;
}

.entry-bar {
  width: 2px;
  height: 20px;
  border-radius: 1px;
  margin-right: 14px;
  flex-shrink: 0;
}

.entry-cam {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  width: 80px;
  flex-shrink: 0;
}

.entry-tc {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--text);
  flex: 1;
}

.entry-duration {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  text-align: right;
}

.footer-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.footer-btn:hover:not(:disabled) { border-color: #333; color: var(--text); }
.footer-btn:disabled { opacity: 0.25; cursor: not-allowed; }
.footer-btn.danger-btn { color: #555; }
.footer-btn.danger-btn:hover { color: #ef4444; border-color: #ef4444; }

.export-menu-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  padding: 9px 14px;
  background: transparent;
  border: none;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 1px;
  text-align: left;
  cursor: pointer;
  transition: background 0.1s;
}
.export-menu-item:hover { background: rgba(255,255,255,0.05); }
.export-menu-item:disabled { opacity: 0.3; cursor: not-allowed; }
.export-menu-item span { font-size: 9px; color: var(--muted); letter-spacing: 0; }

/* TOAST */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--accent);
  color: #000;
  padding: 10px 18px;
  border-radius: 5px;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.2s ease;
  pointer-events: none;
  z-index: 100;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* SHORTCUTS HINT */
.shortcuts {
  padding: 10px 28px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 20px;
  align-items: center;
  flex-shrink: 0;
  background: var(--surface);
}

.shortcut {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
}

.shortcut kbd {
  background: var(--border);
  border: 1px solid #2a2a2a;
  border-radius: 3px;
  padding: 2px 6px;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--text);
}

/* SESSION NAME */
.session-name {
  background: transparent;
  border: none;
  outline: none;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 1px;
  cursor: text;
  width: 160px;
}
.session-name::placeholder { color: #333; }
.session-name:focus { color: var(--text); border-bottom: 1px solid var(--border); }

/* MOBILE */
@media (max-width: 767px) {
  body { height: 100dvh; }
  header { padding: 10px 14px; }
  .logo { font-size: 18px; letter-spacing: 3px; }
  .session-name { width: 110px; font-size: 10px; }
  .header-right select { font-size: 10px; padding: 3px 6px; }
  .status-bar { padding: 8px 14px; }
  .main { flex-direction: column; }
  .cam-panel {
    width: 100%;
    border-right: none;
    border-bottom: 1px solid var(--border);
    padding: 10px;
    max-height: 44vh;
  }
  #camList { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .cam-btn { padding: 9px 10px; gap: 8px; }
  .key-badge { width: 22px; height: 22px; font-size: 11px; }
  .cam-name-input { font-size: 11px; }
  .cam-cut-count { font-size: 9px; }
  .add-cam-btn, .marker-btn { font-size: 9px; padding: 6px; }
  .log-panel { min-height: 0; }
  .shortcuts { padding: 8px 14px; }
  .shortcut { display: none; }
  .shortcuts > div:last-child { margin-left: 0; width: 100%; justify-content: space-between; }
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">MULTICAM</div>
    <input class="session-name" type="text" placeholder="session name..." id="sessionName" value="">
  </div>
  <div class="header-right">
    <select id="fpsSelect" title="Must match your Premiere/Resolve sequence frame rate AND the value entered in the EDL import dialog" style="background:var(--surface);border:1px solid var(--border);color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;padding:4px 8px;border-radius:4px;cursor:pointer;letter-spacing:1px;">
      <option value="2397" selected>23.976 fps (24p)</option>
      <option value="24">24 fps</option>
      <option value="25">25 fps</option>
      <option value="2997">29.97 fps (DF)</option>
      <option value="30">30 fps</option>
    </select>
    <div class="clock" id="clock">00:00:00</div>
  </div>
</header>

<div class="status-bar">
  <div class="status-dot" id="statusDot"></div>
  <div class="status-text" id="statusText">STANDBY</div>
  <span class="elapsed" id="elapsed" style="display:none">00:00:00.000</span>
  <span class="cut-count" id="cutCount" style="display:none; margin-left:auto">0 CUTS</span>
</div>

<div class="main">

  <!-- CAM PANEL -->
  <div class="cam-panel">
    <div class="panel-label">Cameras</div>
    <div id="camList"></div>
    <button class="add-cam-btn" onclick="addCamera()">+ Add Camera</button>
    <button class="marker-btn" id="markerBtn" onclick="addMarker()" disabled>◆ Add Marker <kbd>M</kbd></button>
    <div class="controls">
      <button class="btn primary" id="startBtn" onclick="startSession()">START</button>
      <button class="btn danger" id="stopBtn" onclick="stopSession()" disabled>STOP</button>
    </div>
  </div>

  <!-- LOG PANEL -->
  <div class="log-panel">
    <div class="log-header">
      <div class="log-title">Cut Log</div>
    </div>
    <div class="log-scroll" id="logScroll">
      <div class="log-empty" id="logEmpty">
        <div class="log-empty-icon">⬛</div>
        <div class="log-empty-text">Press START then 1–4 to log cuts</div>
      </div>
    </div>
  </div>

</div>

<div class="shortcuts">
  <div class="shortcut"><kbd>1–8</kbd> Switch Camera</div>
  <div class="shortcut"><kbd>M</kbd> Marker</div>
  <div class="shortcut"><kbd>Space</kbd> Start / Stop</div>
  <div class="shortcut"><kbd>Z</kbd> Undo</div>
  <div class="shortcut"><kbd>E</kbd> Export EDL</div>
  <div style="margin-left:auto; display:flex; gap:8px; align-items:center; position:relative;">
    <button class="footer-btn danger-btn" onclick="newProject()">NEW PROJECT</button>
    <div id="exportDropdown" style="position:relative;">
      <button class="footer-btn" id="exportMenuBtn" onclick="toggleExportMenu()" disabled>EXPORT ▾</button>
      <div id="exportMenu" style="display:none; position:absolute; bottom:calc(100% + 6px); right:0; background:var(--surface); border:1px solid var(--border); border-radius:6px; min-width:200px; overflow:hidden; z-index:50;">
        <button class="export-menu-item" id="exportEDL" onclick="exportEDL()">EDL <span>Premiere / Resolve</span></button>
        <button class="export-menu-item" id="exportCSV" onclick="exportCSV()">CSV <span>Spreadsheet</span></button>
        <button class="export-menu-item" id="exportFCPXML" onclick="exportFCPXML()">FCPXML <span>Final Cut Pro</span></button>
        <div style="height:1px; background:var(--border); margin:2px 0;"></div>
        <button class="export-menu-item" id="exportJSON" onclick="exportJSON()">JSON <span>Raw log data</span></button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // Camera palette (cycles for cameras beyond 4)
  const CAM_COLORS = ['var(--cam1)','var(--cam2)','var(--cam3)','var(--cam4)',
                       'var(--cam5)','var(--cam6)','var(--cam7)','var(--cam8)'];

  // State
  let cameras = [
    {id:1, name:'Camera 1', color:'var(--cam1)'},
    {id:2, name:'Camera 2', color:'var(--cam2)'},
    {id:3, name:'Camera 3', color:'var(--cam3)'},
    {id:4, name:'Camera 4', color:'var(--cam4)'},
  ];
  let nextCamId = 5;
  let camCounts = {1:0,2:0,3:0,4:0};
  let isRunning = false;
  let startTime = null;
  let sessionStartWall = null;
  let cuts = [];
  let markers = [];
  let currentCam = null;
  let elapsedInterval = null;

  // Clock
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      String(now.getHours()).padStart(2,'0') + ':' +
      String(now.getMinutes()).padStart(2,'0') + ':' +
      String(now.getSeconds()).padStart(2,'0');
  }
  updateClock();
  setInterval(updateClock, 1000);

  // Timecode helpers
  function msToTC(ms) {
    const s = Math.floor(ms / 1000);
    const hrs = Math.floor(s / 3600);
    const mins = Math.floor((s % 3600) / 60);
    const secs = s % 60;
    const millis = ms % 1000;
    return `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}.${String(millis).padStart(3,'0')}`;
  }

  function msToDuration(ms) {
    if (ms < 1000) return `${ms}ms`;
    if (ms < 60000) return `${(ms/1000).toFixed(1)}s`;
    return `${Math.floor(ms/60000)}m ${Math.floor((ms%60000)/1000)}s`;
  }

  function getElapsed() {
    if (!startTime) return 0;
    return Date.now() - startTime;
  }

  // Session control
  function startSession() {
    if (isRunning) return;
    isRunning = true;
    startTime = Date.now();
    sessionStartWall = new Date();

    document.getElementById('startBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;
    document.getElementById('statusDot').className = 'status-dot live';
    document.getElementById('statusText').className = 'status-text live';
    document.getElementById('statusText').textContent = 'RECORDING';
    document.getElementById('elapsed').className = 'elapsed live';
    document.getElementById('elapsed').style.display = '';
    document.getElementById('cutCount').style.display = '';

    document.getElementById('markerBtn').disabled = false;

    elapsedInterval = setInterval(() => {
      document.getElementById('elapsed').textContent = msToTC(getElapsed());
    }, 40);

    showToast('Session started');
  }

  function stopSession() {
    if (!isRunning) return;
    isRunning = false;

    // Close last cut
    if (cuts.length > 0 && !cuts[cuts.length-1].outMs) {
      cuts[cuts.length-1].outMs = getElapsed();
      cuts[cuts.length-1].outTC = msToTC(cuts[cuts.length-1].outMs);
      renderLog();
    }

    clearInterval(elapsedInterval);
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
    document.getElementById('statusDot').className = 'status-dot ready';
    document.getElementById('statusText').className = 'status-text ready';
    document.getElementById('statusText').textContent = 'STOPPED';
    document.getElementById('elapsed').className = 'elapsed ready';

    setActiveCam(null);
    document.getElementById('markerBtn').disabled = true;
    enableExports();
    showToast('Session stopped — ready to export');
  }

  // ── Camera panel rendering ────────────────────────────────────
  function renderCamPanel() {
    const list = document.getElementById('camList');
    list.innerHTML = '';
    cameras.forEach((cam, idx) => {
      const div = document.createElement('div');
      div.className = 'cam-btn' + (currentCam === cam.id ? ' active' : '');
      div.id = 'cam' + cam.id;
      div.style.setProperty('--cam-color', cam.color);
      const nameVal = cam.name.replace(/"/g, '&quot;');
      const count = camCounts[cam.id] || 0;
      div.innerHTML = `
        <div class="key-badge">${idx + 1}</div>
        <div class="cam-info">
          <input class="cam-name-input" type="text" value="${nameVal}" id="camName${cam.id}">
          <div class="cam-cut-count" id="camCuts${cam.id}">${count} cut${count===1?'':'s'}</div>
        </div>
        <div class="cam-indicator"></div>
        <button class="cam-remove" title="Remove camera">×</button>`;
      div.querySelector('.cam-name-input').addEventListener('click', e => e.stopPropagation());
      div.querySelector('.cam-name-input').addEventListener('input', e => { cam.name = e.target.value; });
      div.querySelector('.cam-remove').addEventListener('click', e => removeCamera(cam.id, e));
      div.addEventListener('click', e => {
        if (e.target.closest('.cam-remove') || e.target.closest('.cam-name-input')) return;
        logCut(cam.id);
      });
      list.appendChild(div);
    });
  }

  function addCamera() {
    if (cameras.length >= 8) { showToast('Max 8 cameras'); return; }
    const id = nextCamId++;
    const color = CAM_COLORS[cameras.length % CAM_COLORS.length];
    cameras.push({id, name: 'Camera ' + id, color});
    camCounts[id] = 0;
    renderCamPanel();
  }

  function removeCamera(id, e) {
    e.stopPropagation();
    if (cameras.length <= 1) { showToast('Need at least one camera'); return; }
    if (isRunning && currentCam === id) { showToast("Can't remove active camera"); return; }
    cameras = cameras.filter(c => c.id !== id);
    renderCamPanel();
  }

  // ── Active cam + cut logging ───────────────────────────────────
  function setActiveCam(id) {
    cameras.forEach(cam => {
      const btn = document.getElementById('cam' + cam.id);
      if (btn) btn.classList.toggle('active', cam.id === id);
    });
    currentCam = id;
  }

  function logCut(id) {
    if (!isRunning) return;
    const cam = cameras.find(c => c.id === id);
    if (!cam) return;
    const now = getElapsed();

    if (cuts.length > 0 && !cuts[cuts.length-1].outMs) {
      cuts[cuts.length-1].outMs = now;
      cuts[cuts.length-1].outTC = msToTC(now);
    }

    const nameEl = document.getElementById('camName' + id);
    const camName = (nameEl ? nameEl.value : null) || cam.name;
    cuts.push({num: cuts.length+1, cam: id, camName, camColor: cam.color,
      inMs: now, inTC: msToTC(now), outMs: null, outTC: null, wallTime: new Date().toISOString()});

    camCounts[id] = (camCounts[id] || 0) + 1;
    const cutsEl = document.getElementById('camCuts' + id);
    if (cutsEl) cutsEl.textContent = camCounts[id] + ' cut' + (camCounts[id]===1?'':'s');
    document.getElementById('cutCount').textContent = cuts.length + ' CUT' + (cuts.length===1?'':'S');

    setActiveCam(id);
    const btn = document.getElementById('cam' + id);
    if (btn) { btn.classList.remove('fired'); void btn.offsetWidth; btn.classList.add('fired'); }

    renderLog();
  }

  function renderLog() {
    const scroll = document.getElementById('logScroll');
    const empty = document.getElementById('logEmpty');
    scroll.querySelectorAll('.log-entry').forEach(el => el.remove());

    if (cuts.length === 0 && markers.length === 0) {
      empty.style.display = 'flex';
      return;
    }
    empty.style.display = 'none';

    // Interleave cuts and markers sorted by time
    const events = [
      ...cuts.map(c => ({...c, _type:'cut'})),
      ...markers.map(m => ({...m, inMs: m.ms, _type:'marker'}))
    ].sort((a, b) => a.inMs - b.inMs);

    events.forEach((ev, idx) => {
      const div = document.createElement('div');
      if (ev._type === 'marker') {
        div.className = 'log-entry marker';
        div.innerHTML = `
          <div class="entry-num">M${String(ev.num).padStart(2,'0')}</div>
          <div class="entry-bar" style="background:#fbbf24"></div>
          <div class="marker-diamond">◆ MARKER</div>
          <div class="entry-tc">${ev.tc}</div>
          <div class="entry-duration"></div>`;
      } else {
        const isLatest = ev._type === 'cut' && idx === events.length - 1;
        const duration = ev.outMs != null ? msToDuration(ev.outMs - ev.inMs) : '–';
        const color = ev.camColor || 'var(--cam1)';
        div.className = 'log-entry' + (isLatest ? ' latest' : '');
        div.innerHTML = `
          <div class="entry-num">${String(ev.num).padStart(3,'0')}</div>
          <div class="entry-bar" style="background:${color}"></div>
          <div class="entry-cam" style="color:${color}">${ev.camName}</div>
          <div class="entry-tc">${ev.inTC}${ev.outTC ? ' → '+ev.outTC : ''}</div>
          <div class="entry-duration">${duration}</div>`;
      }
      scroll.appendChild(div);
    });

    scroll.scrollTop = scroll.scrollHeight;
  }

  // ── Markers ───────────────────────────────────────────────────
  function addMarker() {
    if (!isRunning) return;
    const now = getElapsed();
    const num = markers.length + 1;
    markers.push({num, ms: now, tc: msToTC(now), wallTime: new Date().toISOString()});
    renderLog();
    showToast('Marker ' + num + ' added');
  }

  function enableExports() {
    const hasCuts = cuts.length > 0;
    document.getElementById('exportMenuBtn').disabled = !hasCuts;
    ['exportEDL','exportCSV','exportFCPXML','exportJSON'].forEach(id => {
      document.getElementById(id).disabled = !hasCuts;
    });
  }

  function toggleExportMenu() {
    const menu = document.getElementById('exportMenu');
    menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
  }

  function newProject() {
    if (isRunning) { showToast('Stop session first'); return; }
    if (!confirm('Are you sure you want to start a new project?\nThis data will be lost.')) return;
    cuts = [];
    markers = [];
    cameras = [
      {id:1, name:'Camera 1', color:'var(--cam1)'},
      {id:2, name:'Camera 2', color:'var(--cam2)'},
      {id:3, name:'Camera 3', color:'var(--cam3)'},
      {id:4, name:'Camera 4', color:'var(--cam4)'},
    ];
    nextCamId = 5;
    camCounts = {1:0,2:0,3:0,4:0};
    currentCam = null;
    document.getElementById('sessionName').value = '';
    document.getElementById('cutCount').textContent = '0 CUTS';
    document.getElementById('elapsed').textContent = '00:00:00.000';
    document.getElementById('elapsed').className = 'elapsed';
    document.getElementById('statusDot').className = 'status-dot';
    document.getElementById('statusText').className = 'status-text';
    document.getElementById('statusText').textContent = 'STANDBY';
    document.getElementById('elapsed').style.display = 'none';
    document.getElementById('cutCount').style.display = 'none';
    document.getElementById('markerBtn').disabled = true;
    startTime = null;
    renderCamPanel();
    enableExports();
    renderLog();
    showToast('New project');
  }

  document.addEventListener('click', e => {
    if (!e.target.closest('#exportDropdown')) {
      document.getElementById('exportMenu').style.display = 'none';
    }
  });

  function undoLastCut() {
    if (!isRunning || cuts.length === 0) return;
    const removed = cuts.pop();
    camCounts[removed.cam] = Math.max(0, (camCounts[removed.cam]||1) - 1);
    const cutsEl = document.getElementById('camCuts' + removed.cam);
    if (cutsEl) cutsEl.textContent = camCounts[removed.cam] + ' cut' + (camCounts[removed.cam]===1?'':'s');
    document.getElementById('cutCount').textContent = cuts.length + ' CUT' + (cuts.length===1?'':'S');
    if (cuts.length > 0) {
      cuts[cuts.length-1].outMs = null;
      cuts[cuts.length-1].outTC = null;
      setActiveCam(cuts[cuts.length-1].cam);
    } else {
      setActiveCam(null);
    }
    renderLog();
    showToast('Last cut removed');
  }

  // EXPORTS
  function getSessionName() {
    return document.getElementById('sessionName').value || 'multicam_log';
  }

  function downloadFile(content, filename, type) {
    const blob = new Blob([content], {type});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function getFPS() {
    const val = document.getElementById('fpsSelect').value;
    if (val === '2397') return 24000 / 1001; // true 23.976fps
    if (val === '2997') return 30000 / 1001; // true 29.97fps
    return parseFloat(val);
  }

  function msToEDLTC(ms) {
    const fps = getFPS();
    const dropFrame = Math.abs(fps - 30000/1001) < 0.01; // only 29.97 is drop frame
    const totalFrames = Math.floor(ms * fps / 1000);     // floor = always round down, consistent with NLE frame counting
    const roundFps = Math.round(fps);
    const frames = totalFrames % roundFps;
    const totalSecs = Math.floor(totalFrames / roundFps);
    const secs = totalSecs % 60;
    const mins = Math.floor(totalSecs / 60) % 60;
    const hrs = Math.floor(totalSecs / 3600);
    const sep = dropFrame ? ';' : ':';
    return `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}${sep}${String(frames).padStart(2,'0')}`;
  }

  function toReelName(name) {
    // EDL reel names: max 8 chars, alphanumeric only
    return (name || 'CAM').replace(/[^a-zA-Z0-9]/g, '').substring(0, 8) || 'CAM';
  }

  function exportEDL() {
    if (cuts.length === 0) return;
    const name = getSessionName();
    const fps = getFPS();
    const dropFrame = Math.abs(fps - 29.97) < 0.01;
    const fcm = dropFrame ? 'DROP FRAME' : 'NON-DROP FRAME';
    let edl = `TITLE: ${name}\nFCM: ${fcm}\n\n`;

    cuts.forEach((cut, i) => {
      if (!cut.outMs) return;
      const reel = toReelName(cut.camName);
      const num = String(i + 1).padStart(3, '0');
      const srcIn  = msToEDLTC(cut.inMs);
      const srcOut = msToEDLTC(cut.outMs);
      const recIn  = msToEDLTC(cut.inMs);
      const recOut = msToEDLTC(cut.outMs);
      edl += `${num}  ${reel.padEnd(8)}  V     C        ${srcIn} ${srcOut} ${recIn} ${recOut}\n`;
      edl += `* FROM CLIP NAME: ${cut.camName}\n\n`;
    });

    if (markers.length > 0) {
      edl += `\n`;
      markers.forEach(m => {
        const tc = msToEDLTC(m.ms);
        edl += `* MARKER ${String(m.num).padStart(2,'0')}: ${tc}\n`;
      });
    }

    downloadFile(edl, `${name}.edl`, 'text/plain');
    showToast('EDL exported');
  }

  function exportCSV() {
    if (cuts.length === 0) return;
    const name = getSessionName();
    let csv = 'Cut #,Camera,Camera Name,In TC,Out TC,In Ms,Out Ms,Duration Ms,Wall Time\n';
    cuts.forEach(cut => {
      csv += `${cut.num},${cut.cam},"${cut.camName}",${cut.inTC},${cut.outTC||''},${cut.inMs},${cut.outMs||''},${cut.outMs?cut.outMs-cut.inMs:''},"${cut.wallTime}"\n`;
    });
    downloadFile(csv, `${name}.csv`, 'text/csv');
    showToast('CSV exported');
  }

  function exportFCPXML() {
    if (cuts.length === 0) return;
    const name = getSessionName();
    const totalMs = cuts.length > 0 ? (cuts[cuts.length-1].outMs || getElapsed()) : 0;
    const msToRational = ms => `${ms}/1000s`;

    let xml = `<?xml version="1.0" encoding="UTF-8"?>\n`;
    xml += `<!DOCTYPE fcpxml>\n`;
    xml += `<fcpxml version="1.9">\n`;
    xml += `  <resources>\n`;
    cameras.forEach(cam => {
      xml += `    <format id="r${cam.id}" name="FFVideoFormat1080p2398" frameDuration="1001/24000s" width="1920" height="1080"/>\n`;
    });
    cameras.forEach(cam => {
      const nameEl = document.getElementById('camName'+cam.id);
      const camName = (nameEl ? nameEl.value : null) || cam.name;
      xml += `    <asset id="asset${cam.id}" name="${camName}" start="0s" duration="${msToRational(totalMs)}" hasVideo="1" hasAudio="1" format="r${cam.id}">\n`;
      xml += `      <media-rep kind="original-media" src="file:///path/to/${camName.replace(/ /g,'_')}.mp4"/>\n`;
      xml += `    </asset>\n`;
    });
    xml += `  </resources>\n`;
    xml += `  <library>\n    <event name="${name}">\n`;
    xml += `      <project name="${name}">\n`;
    xml += `        <sequence format="r1" duration="${msToRational(totalMs)}" tcStart="0s" tcFormat="NDF">\n`;
    xml += `          <spine>\n`;

    cuts.forEach(cut => {
      if (!cut.outMs) return;
      const dur = cut.outMs - cut.inMs;
      xml += `            <clip name="${cut.camName}" offset="${msToRational(cut.inMs)}" duration="${msToRational(dur)}" start="${msToRational(cut.inMs)}">\n`;
      xml += `              <asset-clip ref="asset${cut.cam}" offset="0s" duration="${msToRational(dur)}" start="${msToRational(cut.inMs)}"/>\n`;
      xml += `            </clip>\n`;
    });

    xml += `          </spine>\n        </sequence>\n      </project>\n    </event>\n  </library>\n</fcpxml>`;
    downloadFile(xml, `${name}.fcpxml`, 'text/xml');
    showToast('FCPXML exported');
  }

  function exportJSON() {
    if (cuts.length === 0) return;
    const name = getSessionName();
    const data = {
      session: name,
      startTime: sessionStartWall,
      timecodeFormat: 'HH:MM:SS.mmm',
      totalCuts: cuts.length,
      cameras: cameras.map(cam => ({
        id: cam.id,
        name: (document.getElementById('camName'+cam.id)||{}).value || cam.name,
        cuts: camCounts[cam.id] || 0
      })),
      markers: markers,
      cuts: cuts
    };
    downloadFile(JSON.stringify(data, null, 2), `${name}.json`, 'application/json');
    showToast('JSON exported');
  }

  // Toast
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;

    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      isRunning ? stopSession() : startSession();
      return;
    }

    const camIdx = parseInt(e.key) - 1;
    if (!isNaN(camIdx) && camIdx >= 0 && camIdx < cameras.length) {
      logCut(cameras[camIdx].id);
      return;
    }

    if (e.key === 'm' || e.key === 'M') { addMarker(); return; }
    if (e.key === 'z' || e.key === 'Z') { undoLastCut(); return; }
    if (e.key === 'e' || e.key === 'E') { if (cuts.length > 0 && !isRunning) exportEDL(); return; }
  });

  // Init
  renderCamPanel();
  renderLog();
</script>

</body>
</html>
