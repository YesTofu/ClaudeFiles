<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MULTICAM LOGGER</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap');

:root {
  --bg: #0a0a0a;
  --surface: #111111;
  --border: #1e1e1e;
  --accent: #e8ff47;
  --accent-dim: rgba(232,255,71,0.12);
  --text: #f0f0f0;
  --muted: #555;
  --cam1: #ff6b6b;
  --cam2: #4ecdc4;
  --cam3: #a78bfa;
  --cam4: #fbbf24;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* HEADER */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 28px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 4px;
  color: var(--accent);
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 20px;
}

.clock {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 1px;
}

/* STATUS BAR */
.status-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 28px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--muted);
  transition: background 0.2s;
}
.status-dot.live { background: #ef4444; animation: pulse 1.2s ease-in-out infinite; }
.status-dot.ready { background: var(--accent); }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.status-text {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
}
.status-text.live { color: #ef4444; }
.status-text.ready { color: var(--accent); }

.elapsed {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 1px;
}
.elapsed.live { color: #ef4444; }
.elapsed.ready { color: var(--accent); }

.cut-count {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 1px;
}

/* MAIN LAYOUT */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* CAM PANEL */
.cam-panel {
  width: 260px;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 20px 16px;
  gap: 10px;
  flex-shrink: 0;
}

.panel-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 4px;
  padding: 0 4px;
}

.cam-btn {
  position: relative;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px 16px;
  background: var(--surface);
  cursor: pointer;
  transition: all 0.12s ease;
  display: flex;
  align-items: center;
  gap: 14px;
  overflow: hidden;
  user-select: none;
}

.cam-btn::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--cam-color);
  opacity: 0.5;
  transition: opacity 0.12s;
}

.cam-btn:hover { border-color: #333; background: #161616; }

.cam-btn.active {
  border-color: var(--cam-color);
  background: rgba(255,255,255,0.04);
}
.cam-btn.active::before { opacity: 1; }

.cam-btn.fired {
  animation: camFire 0.3s ease;
}
@keyframes camFire {
  0% { transform: scale(1); }
  40% { transform: scale(0.97); }
  100% { transform: scale(1); }
}

.key-badge {
  width: 28px;
  height: 28px;
  border-radius: 5px;
  background: var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  flex-shrink: 0;
  border: 1px solid #2a2a2a;
  transition: all 0.12s;
}
.cam-btn.active .key-badge {
  background: var(--cam-color);
  color: #000;
  border-color: var(--cam-color);
}

.cam-info { flex: 1; }
.cam-name-input {
  background: transparent;
  border: none;
  outline: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  width: 100%;
  cursor: text;
}
.cam-name-input::placeholder { color: var(--muted); }

.cam-cut-count {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  margin-top: 2px;
}

.cam-indicator {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--cam-color);
  opacity: 0.3;
  flex-shrink: 0;
  transition: opacity 0.12s;
}
.cam-btn.active .cam-indicator { opacity: 1; }

/* CONTROLS */
.controls {
  display: flex;
  gap: 8px;
  margin-top: auto;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

.btn {
  flex: 1;
  padding: 10px 8px;
  border-radius: 5px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.15s;
}
.btn:hover { border-color: #333; background: #161616; }
.btn.primary {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
  font-weight: 500;
}
.btn.primary:hover { background: #d4eb3a; }
.btn.danger { color: #ef4444; border-color: #ef4444; }
.btn.danger:hover { background: rgba(239,68,68,0.1); }
.btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* LOG PANEL */
.log-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.log-header {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.log-title {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
}

.log-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 12px 0;
}

.log-scroll::-webkit-scrollbar { width: 4px; }
.log-scroll::-webkit-scrollbar-track { background: transparent; }
.log-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.log-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 8px;
  color: var(--muted);
}

.log-empty-icon {
  font-size: 32px;
  opacity: 0.3;
}

.log-empty-text {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.log-entry {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 0 24px;
  height: 40px;
  border-bottom: 1px solid rgba(255,255,255,0.03);
  transition: background 0.1s;
  animation: entryIn 0.2s ease;
}

@keyframes entryIn {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: translateX(0); }
}

.log-entry:hover { background: rgba(255,255,255,0.02); }

.log-entry.latest {
  background: rgba(232,255,71,0.04);
}

.entry-num {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  width: 36px;
  flex-shrink: 0;
}

.entry-bar {
  width: 2px;
  height: 20px;
  border-radius: 1px;
  margin-right: 14px;
  flex-shrink: 0;
}

.entry-cam {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  width: 80px;
  flex-shrink: 0;
}

.entry-tc {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--text);
  flex: 1;
}

.entry-duration {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  text-align: right;
}

.footer-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.footer-btn:hover:not(:disabled) { border-color: #333; color: var(--text); }
.footer-btn:disabled { opacity: 0.25; cursor: not-allowed; }
.footer-btn.danger-btn { color: #555; }
.footer-btn.danger-btn:hover { color: #ef4444; border-color: #ef4444; }

.export-menu-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  padding: 9px 14px;
  background: transparent;
  border: none;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 1px;
  text-align: left;
  cursor: pointer;
  transition: background 0.1s;
}
.export-menu-item:hover { background: rgba(255,255,255,0.05); }
.export-menu-item:disabled { opacity: 0.3; cursor: not-allowed; }
.export-menu-item span { font-size: 9px; color: var(--muted); letter-spacing: 0; }

/* TOAST */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--accent);
  color: #000;
  padding: 10px 18px;
  border-radius: 5px;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.2s ease;
  pointer-events: none;
  z-index: 100;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* SHORTCUTS HINT */
.shortcuts {
  padding: 10px 28px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 20px;
  align-items: center;
  flex-shrink: 0;
  background: var(--surface);
}

.shortcut {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
}

.shortcut kbd {
  background: var(--border);
  border: 1px solid #2a2a2a;
  border-radius: 3px;
  padding: 2px 6px;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--text);
}

/* SESSION NAME */
.session-name {
  background: transparent;
  border: none;
  outline: none;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 1px;
  cursor: text;
  width: 160px;
}
.session-name::placeholder { color: #333; }
.session-name:focus { color: var(--text); border-bottom: 1px solid var(--border); }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">MULTICAM</div>
    <input class="session-name" type="text" placeholder="session name..." id="sessionName" value="">
  </div>
  <div class="header-right">
    <select id="fpsSelect" title="Must match your Premiere/Resolve sequence frame rate AND the value entered in the EDL import dialog" style="background:var(--surface);border:1px solid var(--border);color:var(--muted);font-family:'DM Mono',monospace;font-size:11px;padding:4px 8px;border-radius:4px;cursor:pointer;letter-spacing:1px;">
      <option value="2397" selected>23.976 fps (24p)</option>
      <option value="24">24 fps</option>
      <option value="25">25 fps</option>
      <option value="2997">29.97 fps (DF)</option>
      <option value="30">30 fps</option>
    </select>
    <div class="clock" id="clock">00:00:00</div>
  </div>
</header>

<div class="status-bar">
  <div class="status-dot" id="statusDot"></div>
  <div class="status-text" id="statusText">STANDBY</div>
  <span class="elapsed" id="elapsed" style="display:none">00:00:00.000</span>
  <span class="cut-count" id="cutCount" style="display:none; margin-left:auto">0 CUTS</span>
</div>

<div class="main">

  <!-- CAM PANEL -->
  <div class="cam-panel">
    <div class="panel-label">Cameras</div>

    <div class="cam-btn" id="cam1" style="--cam-color: var(--cam1)" onclick="logCut(1)" data-cam="1">
      <div class="key-badge">1</div>
      <div class="cam-info">
        <input class="cam-name-input" type="text" value="Camera 1" id="camName1" onclick="event.stopPropagation()">
        <div class="cam-cut-count" id="camCuts1">0 cuts</div>
      </div>
      <div class="cam-indicator"></div>
    </div>

    <div class="cam-btn" id="cam2" style="--cam-color: var(--cam2)" onclick="logCut(2)" data-cam="2">
      <div class="key-badge">2</div>
      <div class="cam-info">
        <input class="cam-name-input" type="text" value="Camera 2" id="camName2" onclick="event.stopPropagation()">
        <div class="cam-cut-count" id="camCuts2">0 cuts</div>
      </div>
      <div class="cam-indicator"></div>
    </div>

    <div class="cam-btn" id="cam3" style="--cam-color: var(--cam3)" onclick="logCut(3)" data-cam="3">
      <div class="key-badge">3</div>
      <div class="cam-info">
        <input class="cam-name-input" type="text" value="Camera 3" id="camName3" onclick="event.stopPropagation()">
        <div class="cam-cut-count" id="camCuts3">0 cuts</div>
      </div>
      <div class="cam-indicator"></div>
    </div>

    <div class="cam-btn" id="cam4" style="--cam-color: var(--cam4)" onclick="logCut(4)" data-cam="4">
      <div class="key-badge">4</div>
      <div class="cam-info">
        <input class="cam-name-input" type="text" value="Camera 4" id="camName4" onclick="event.stopPropagation()">
        <div class="cam-cut-count" id="camCuts4">0 cuts</div>
      </div>
      <div class="cam-indicator"></div>
    </div>

    <div class="controls">
      <button class="btn primary" id="startBtn" onclick="startSession()">START</button>
      <button class="btn danger" id="stopBtn" onclick="stopSession()" disabled>STOP</button>
    </div>
  </div>

  <!-- LOG PANEL -->
  <div class="log-panel">
    <div class="log-header">
      <div class="log-title">Cut Log</div>
    </div>
    <div class="log-scroll" id="logScroll">
      <div class="log-empty" id="logEmpty">
        <div class="log-empty-icon">⬛</div>
        <div class="log-empty-text">Press START then 1–4 to log cuts</div>
      </div>
    </div>
  </div>

</div>

<div class="shortcuts">
  <div class="shortcut"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> Switch Camera</div>
  <div class="shortcut"><kbd>Space</kbd> Start / Stop</div>
  <div class="shortcut"><kbd>Z</kbd> Undo Last Cut</div>
  <div class="shortcut"><kbd>E</kbd> Export EDL</div>
  <div style="margin-left:auto; display:flex; gap:8px; align-items:center; position:relative;">
    <button class="footer-btn danger-btn" onclick="newProject()">NEW PROJECT</button>
    <div id="exportDropdown" style="position:relative;">
      <button class="footer-btn" id="exportMenuBtn" onclick="toggleExportMenu()" disabled>EXPORT ▾</button>
      <div id="exportMenu" style="display:none; position:absolute; bottom:calc(100% + 6px); right:0; background:var(--surface); border:1px solid var(--border); border-radius:6px; min-width:200px; overflow:hidden; z-index:50;">
        <button class="export-menu-item" id="exportEDL" onclick="exportEDL()">EDL <span>Premiere / Resolve</span></button>
        <button class="export-menu-item" id="exportCSV" onclick="exportCSV()">CSV <span>Spreadsheet</span></button>
        <button class="export-menu-item" id="exportFCPXML" onclick="exportFCPXML()">FCPXML <span>Final Cut Pro</span></button>
        <div style="height:1px; background:var(--border); margin:2px 0;"></div>
        <button class="export-menu-item" id="exportJSON" onclick="exportJSON()">JSON <span>Raw log data</span></button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // State
  let isRunning = false;
  let startTime = null;
  let sessionStartWall = null;
  let cuts = [];
  let currentCam = null;
  let elapsedInterval = null;
  let camCounts = {1:0, 2:0, 3:0, 4:0};
  const VALID_CAMS = [1,2,3,4];

  // Clock
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      String(now.getHours()).padStart(2,'0') + ':' +
      String(now.getMinutes()).padStart(2,'0') + ':' +
      String(now.getSeconds()).padStart(2,'0');
  }
  updateClock();
  setInterval(updateClock, 1000);

  // Timecode helpers
  function msToTC(ms) {
    const s = Math.floor(ms / 1000);
    const hrs = Math.floor(s / 3600);
    const mins = Math.floor((s % 3600) / 60);
    const secs = s % 60;
    const millis = ms % 1000;
    return `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}.${String(millis).padStart(3,'0')}`;
  }

  function msToDuration(ms) {
    if (ms < 1000) return `${ms}ms`;
    if (ms < 60000) return `${(ms/1000).toFixed(1)}s`;
    return `${Math.floor(ms/60000)}m ${Math.floor((ms%60000)/1000)}s`;
  }

  function getElapsed() {
    if (!startTime) return 0;
    return Date.now() - startTime;
  }

  // Session control
  function startSession() {
    if (isRunning) return;
    isRunning = true;
    startTime = Date.now();
    sessionStartWall = new Date();

    document.getElementById('startBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;
    document.getElementById('statusDot').className = 'status-dot live';
    document.getElementById('statusText').className = 'status-text live';
    document.getElementById('statusText').textContent = 'RECORDING';
    document.getElementById('elapsed').className = 'elapsed live';
    document.getElementById('elapsed').style.display = '';
    document.getElementById('cutCount').style.display = '';

    elapsedInterval = setInterval(() => {
      document.getElementById('elapsed').textContent = msToTC(getElapsed());
    }, 40);

    showToast('Session started');
  }

  function stopSession() {
    if (!isRunning) return;
    isRunning = false;

    // Close last cut
    if (cuts.length > 0 && !cuts[cuts.length-1].outMs) {
      cuts[cuts.length-1].outMs = getElapsed();
      cuts[cuts.length-1].outTC = msToTC(cuts[cuts.length-1].outMs);
      renderLog();
    }

    clearInterval(elapsedInterval);
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
    document.getElementById('statusDot').className = 'status-dot ready';
    document.getElementById('statusText').className = 'status-text ready';
    document.getElementById('statusText').textContent = 'STOPPED';
    document.getElementById('elapsed').className = 'elapsed ready';

    setActiveCam(null);
    enableExports();
    showToast('Session stopped — ready to export');
  }

  function setActiveCam(n) {
    [1,2,3,4].forEach(i => {
      document.getElementById('cam'+i).classList.toggle('active', i === n);
    });
    currentCam = n;
  }

  function logCut(n) {
    if (!isRunning) return;

    const now = getElapsed();

    // Close previous cut
    if (cuts.length > 0 && !cuts[cuts.length-1].outMs) {
      cuts[cuts.length-1].outMs = now;
      cuts[cuts.length-1].outTC = msToTC(now);
    }

    // Open new cut
    const camName = document.getElementById('camName'+n).value || 'Camera '+n;
    cuts.push({
      num: cuts.length + 1,
      cam: n,
      camName: camName,
      inMs: now,
      inTC: msToTC(now),
      outMs: null,
      outTC: null,
      wallTime: new Date().toISOString()
    });

    camCounts[n]++;
    document.getElementById('camCuts'+n).textContent = camCounts[n] + ' cut' + (camCounts[n]===1?'':'s');
    document.getElementById('cutCount').textContent = cuts.length + ' CUT' + (cuts.length===1?'':'S');

    setActiveCam(n);

    // Fire animation
    const btn = document.getElementById('cam'+n);
    btn.classList.remove('fired');
    void btn.offsetWidth;
    btn.classList.add('fired');

    renderLog();
  }

  // FIX: Don't wipe innerHTML — only remove .log-entry elements so #logEmpty stays in the DOM
  function renderLog() {
    const scroll = document.getElementById('logScroll');
    const empty = document.getElementById('logEmpty');

    // Remove only existing log entries, leaving the empty-state element intact
    scroll.querySelectorAll('.log-entry').forEach(el => el.remove());

    if (cuts.length === 0) {
      empty.style.display = 'flex';
      return;
    }
    empty.style.display = 'none';

    const colors = ['var(--cam1)','var(--cam2)','var(--cam3)','var(--cam4)'];

    cuts.forEach((cut, idx) => {
      const isLatest = idx === cuts.length - 1;
      const duration = cut.outMs != null ? msToDuration(cut.outMs - cut.inMs) : '–';
      const div = document.createElement('div');
      div.className = 'log-entry' + (isLatest ? ' latest' : '');
      div.innerHTML = `
        <div class="entry-num">${String(cut.num).padStart(3,'0')}</div>
        <div class="entry-bar" style="background:${colors[cut.cam-1]}"></div>
        <div class="entry-cam" style="color:${colors[cut.cam-1]}">${cut.camName}</div>
        <div class="entry-tc">${cut.inTC}${cut.outTC ? ' → '+cut.outTC : ''}</div>
        <div class="entry-duration">${duration}</div>
      `;
      scroll.appendChild(div);
    });

    scroll.scrollTop = scroll.scrollHeight;
  }

  function enableExports() {
    const hasCuts = cuts.length > 0;
    document.getElementById('exportMenuBtn').disabled = !hasCuts;
    ['exportEDL','exportCSV','exportFCPXML','exportJSON'].forEach(id => {
      document.getElementById(id).disabled = !hasCuts;
    });
  }

  function toggleExportMenu() {
    const menu = document.getElementById('exportMenu');
    menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
  }

  function newProject() {
    if (isRunning) { showToast('Stop session first'); return; }
    if (!confirm('Are you sure you want to start a new project?\nThis data will be lost.')) return;
    cuts = [];
    camCounts = {1:0,2:0,3:0,4:0};
    currentCam = null;
    [1,2,3,4].forEach(i => {
      document.getElementById('camCuts'+i).textContent = '0 cuts';
      document.getElementById('cam'+i).classList.remove('active');
    });
    document.getElementById('sessionName').value = '';
    document.getElementById('cutCount').textContent = '0 CUTS';
    document.getElementById('elapsed').textContent = '00:00:00.000';
    document.getElementById('elapsed').className = 'elapsed';
    document.getElementById('statusDot').className = 'status-dot';
    document.getElementById('statusText').className = 'status-text';
    document.getElementById('statusText').textContent = 'STANDBY';
    document.getElementById('elapsed').style.display = 'none';
    document.getElementById('cutCount').style.display = 'none';
    startTime = null;
    enableExports();
    renderLog();
    showToast('New project');
  }

  document.addEventListener('click', e => {
    if (!e.target.closest('#exportDropdown')) {
      document.getElementById('exportMenu').style.display = 'none';
    }
  });

  function undoLastCut() {
    if (!isRunning || cuts.length === 0) return;
    const removed = cuts.pop();
    camCounts[removed.cam] = Math.max(0, camCounts[removed.cam]-1);
    document.getElementById('camCuts'+removed.cam).textContent = camCounts[removed.cam] + ' cut' + (camCounts[removed.cam]===1?'':'s');
    document.getElementById('cutCount').textContent = cuts.length + ' CUT' + (cuts.length===1?'':'S');
    // Reopen previous
    if (cuts.length > 0) {
      cuts[cuts.length-1].outMs = null;
      cuts[cuts.length-1].outTC = null;
      setActiveCam(cuts[cuts.length-1].cam);
    } else {
      setActiveCam(null);
    }
    renderLog();
    showToast('Last cut removed');
  }

  // EXPORTS
  function getSessionName() {
    return document.getElementById('sessionName').value || 'multicam_log';
  }

  function downloadFile(content, filename, type) {
    const blob = new Blob([content], {type});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function getFPS() {
    const val = document.getElementById('fpsSelect').value;
    if (val === '2397') return 24000 / 1001; // true 23.976fps
    if (val === '2997') return 30000 / 1001; // true 29.97fps
    return parseFloat(val);
  }

  function msToEDLTC(ms) {
    const fps = getFPS();
    const dropFrame = Math.abs(fps - 30000/1001) < 0.01; // only 29.97 is drop frame
    const totalFrames = Math.floor(ms * fps / 1000);     // floor = always round down, consistent with NLE frame counting
    const roundFps = Math.round(fps);
    const frames = totalFrames % roundFps;
    const totalSecs = Math.floor(totalFrames / roundFps);
    const secs = totalSecs % 60;
    const mins = Math.floor(totalSecs / 60) % 60;
    const hrs = Math.floor(totalSecs / 3600);
    const sep = dropFrame ? ';' : ':';
    return `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}${sep}${String(frames).padStart(2,'0')}`;
  }

  function toReelName(name) {
    // EDL reel names: max 8 chars, alphanumeric only
    return (name || 'CAM').replace(/[^a-zA-Z0-9]/g, '').substring(0, 8) || 'CAM';
  }

  function exportEDL() {
    if (cuts.length === 0) return;
    const name = getSessionName();
    const fps = getFPS();
    const dropFrame = Math.abs(fps - 29.97) < 0.01;
    const fcm = dropFrame ? 'DROP FRAME' : 'NON-DROP FRAME';
    let edl = `TITLE: ${name}\nFCM: ${fcm}\n\n`;

    cuts.forEach((cut, i) => {
      if (!cut.outMs) return;
      const reel = toReelName(cut.camName);
      const num = String(i + 1).padStart(3, '0');
      const srcIn  = msToEDLTC(cut.inMs);
      const srcOut = msToEDLTC(cut.outMs);
      const recIn  = msToEDLTC(cut.inMs);
      const recOut = msToEDLTC(cut.outMs);
      edl += `${num}  ${reel.padEnd(8)}  V     C        ${srcIn} ${srcOut} ${recIn} ${recOut}\n`;
      edl += `* FROM CLIP NAME: ${cut.camName}\n\n`;
    });

    downloadFile(edl, `${name}.edl`, 'text/plain');
    showToast('EDL exported');
  }

  function exportCSV() {
    if (cuts.length === 0) return;
    const name = getSessionName();
    let csv = 'Cut #,Camera,Camera Name,In TC,Out TC,In Ms,Out Ms,Duration Ms,Wall Time\n';
    cuts.forEach(cut => {
      csv += `${cut.num},${cut.cam},"${cut.camName}",${cut.inTC},${cut.outTC||''},${cut.inMs},${cut.outMs||''},${cut.outMs?cut.outMs-cut.inMs:''},"${cut.wallTime}"\n`;
    });
    downloadFile(csv, `${name}.csv`, 'text/csv');
    showToast('CSV exported');
  }

  function exportFCPXML() {
    if (cuts.length === 0) return;
    const name = getSessionName();
    const totalMs = cuts.length > 0 ? (cuts[cuts.length-1].outMs || getElapsed()) : 0;
    const msToRational = ms => `${ms}/1000s`;

    let xml = `<?xml version="1.0" encoding="UTF-8"?>\n`;
    xml += `<!DOCTYPE fcpxml>\n`;
    xml += `<fcpxml version="1.9">\n`;
    xml += `  <resources>\n`;
    [1,2,3,4].forEach(i => {
      xml += `    <format id="r${i}" name="FFVideoFormat1080p2398" frameDuration="1001/24000s" width="1920" height="1080"/>\n`;
    });
    [1,2,3,4].forEach(i => {
      const camName = document.getElementById('camName'+i).value || 'Camera '+i;
      xml += `    <asset id="asset${i}" name="${camName}" start="0s" duration="${msToRational(totalMs)}" hasVideo="1" hasAudio="1" format="r${i}">\n`;
      xml += `      <media-rep kind="original-media" src="file:///path/to/${camName.replace(/ /g,'_')}.mp4"/>\n`;
      xml += `    </asset>\n`;
    });
    xml += `  </resources>\n`;
    xml += `  <library>\n    <event name="${name}">\n`;
    xml += `      <project name="${name}">\n`;
    xml += `        <sequence format="r1" duration="${msToRational(totalMs)}" tcStart="0s" tcFormat="NDF">\n`;
    xml += `          <spine>\n`;

    cuts.forEach(cut => {
      if (!cut.outMs) return;
      const dur = cut.outMs - cut.inMs;
      xml += `            <clip name="${cut.camName}" offset="${msToRational(cut.inMs)}" duration="${msToRational(dur)}" start="${msToRational(cut.inMs)}">\n`;
      xml += `              <asset-clip ref="asset${cut.cam}" offset="0s" duration="${msToRational(dur)}" start="${msToRational(cut.inMs)}"/>\n`;
      xml += `            </clip>\n`;
    });

    xml += `          </spine>\n        </sequence>\n      </project>\n    </event>\n  </library>\n</fcpxml>`;
    downloadFile(xml, `${name}.fcpxml`, 'text/xml');
    showToast('FCPXML exported');
  }

  function exportJSON() {
    if (cuts.length === 0) return;
    const name = getSessionName();
    const data = {
      session: name,
      startTime: sessionStartWall,
      timecodeFormat: 'HH:MM:SS.mmm',
      totalCuts: cuts.length,
      cameras: [1,2,3,4].map(i => ({
        id: i,
        name: document.getElementById('camName'+i).value || 'Camera '+i,
        cuts: camCounts[i]
      })),
      cuts: cuts
    };
    downloadFile(JSON.stringify(data, null, 2), `${name}.json`, 'application/json');
    showToast('JSON exported');
  }

  // Toast
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;

    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      isRunning ? stopSession() : startSession();
      return;
    }

    const camNum = parseInt(e.key);
    if (VALID_CAMS.includes(camNum)) {
      logCut(camNum);
      return;
    }

    if (e.key === 'z' || e.key === 'Z') { undoLastCut(); return; }
    if (e.key === 'e' || e.key === 'E') { if (cuts.length > 0 && !isRunning) exportEDL(); return; }
  });

  // Init
  renderLog();
</script>

</body>
</html>
